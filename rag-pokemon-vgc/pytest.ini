[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logs más verbosos
log_cli = true
log_cli_level = INFO

# Reporte corto pero informativo
addopts = -v --tb=short --strict-markers
markers =
    slow: tests que tardan más de 5 segundos